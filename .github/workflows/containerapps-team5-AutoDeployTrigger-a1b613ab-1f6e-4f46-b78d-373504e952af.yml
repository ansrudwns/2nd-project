name: Historical Azure Container Apps Deployment

# Preserved as evidence of the original deployment pipeline.
# The Azure resource and deployment credentials are no longer active.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.CONTAINERAPPSTEAM5_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINERAPPSTEAM5_REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: m86865/containerapps-team5:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.CONTAINERAPPSTEAM5_AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: containerapps-team5
          resourceGroup: 8ai-2nd-team5
          imageToDeploy: m86865/containerapps-team5:${{ github.sha }}
